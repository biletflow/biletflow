name: biletflow

# `docker compose up -d` starts only the backing services, which is what you want for
# day-to-day development while running Next.js on the host. Add `--profile app` to also
# build and run the web container for the demonstration deployment.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: biletflow
      POSTGRES_PASSWORD: biletflow
      POSTGRES_DB: biletflow
    ports:
      # 5433 on the host: many machines already run a native Postgres on 5432, and
      # localhost would resolve to that one instead of this container.
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biletflow -d biletflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Fake SMTP server. SMTP on 1025, inbox UI on http://localhost:8025.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

  # S3-compatible storage. API on 9000, console on http://localhost:9001.
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: biletflow
      MINIO_ROOT_PASSWORD: biletflow
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 biletflow biletflow &&
      mc mb --ignore-existing local/biletflow-uploads &&
      mc anonymous set download local/biletflow-uploads
      "

  web:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://biletflow:biletflow@postgres:5432/biletflow?schema=public
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      S3_ENDPOINT: http://minio:9000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    env_file:
      - ../.env

volumes:
  postgres-data:
  minio-data:
