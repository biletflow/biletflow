name: Bug
description: Something behaves incorrectly
labels: ["bug"]
body:
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Where
      options:
        - attendee web
        - organizer web
        - admin portal
        - API
        - scanner app
        - local infrastructure
    validations:
      required: true

  - type: input
    id: blocks_demo
    attributes:
      label: Does this block the demo flow in docs/PLAN.md section 4?
      placeholder: yes / no
    validations:
      required: true
