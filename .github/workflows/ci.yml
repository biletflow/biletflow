name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: biletflow
          POSTGRES_PASSWORD: biletflow
          POSTGRES_DB: biletflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://biletflow:biletflow@localhost:5432/biletflow_test?schema=public
      BETTER_AUTH_SECRET: ci-secret-not-used-anywhere-else
      BETTER_AUTH_URL: http://localhost:3000
      TICKET_SIGNING_KEY: ci-ticket-signing-key
      CAMPAIGN_SIGNING_KEY: ci-campaign-signing-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RUN_AUTH_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Types come from the generated client, so this must precede typecheck.
      - run: pnpm --filter @biletflow/db run generate

      # `pnpm -r run` skips workspace packages that do not define the script, so this
      # stays green while apps/web and apps/scanner are still being scaffolded.
      - run: pnpm -r run lint
      - run: pnpm -r run typecheck
      - run: pnpm --filter @biletflow/db run deploy
      - run: pnpm -r run test

      - name: Test web and scanner authentication over HTTP
        timeout-minutes: 5
        run: |
          pnpm --filter @biletflow/db run seed
          pnpm --filter web exec next dev --webpack --hostname 127.0.0.1 > /tmp/biletflow-web.log 2>&1 &
          web_pid=$!
          trap 'kill "$web_pid" 2>/dev/null || true; cat /tmp/biletflow-web.log' EXIT
          ready=0
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/me)" = 401 ]; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          RUN_HTTP_INTEGRATION=1 pnpm --filter web exec vitest run src/lib/auth.http.test.ts
